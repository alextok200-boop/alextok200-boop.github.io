<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系 - 戴程鹏</title>
  <meta name="description" content="联系戴程鹏：商务合作、品牌电商咨询、AI 技能包合作。">
  <link rel="stylesheet" href="css/style.css?v=1.4.5">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="logo">DAI<span class="accent">·</span>CP</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="work.html">作品集</a>
        <a href="blog.html">博客</a>
        <a href="contact.html" class="active">联系</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="contact.eyebrow">Contact</p>
        <h1 data-i18n="contact.title">联系我</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-info">
            <h2 data-i18n="contact.info.title">合作与交流</h2>
            <p data-i18n="contact.info.desc">品牌电商咨询、AI 技能包合作、行业交流，欢迎联系。</p>
            <ul class="contact-list">
              <li>
                <span class="contact-label" data-i18n="contact.email">邮箱</span>
                <a href="mailto:alextok200@gmail.com">alextok200@gmail.com</a>
              </li>
              <li>
                <span class="contact-label" data-i18n="contact.github">GitHub</span>
                <a href="https://github.com/alextok200" target="_blank" rel="noopener">github.com/alextok200</a>
              </li>
            </ul>
          </div>
          <form class="contact-form" id="contactForm">
            <h2 data-i18n="contact.form.title">留言</h2>
            <label for="name" data-i18n="contact.form.name">称呼</label>
            <input type="text" id="name" name="name" placeholder="怎么称呼你" required data-i18n-attr="placeholder:contact.form.name.ph">
            <label for="email" data-i18n="contact.form.email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="你的邮箱" required data-i18n-attr="placeholder:contact.form.email.ph">
            <label for="message" data-i18n="contact.form.msg">内容</label>
            <textarea id="message" name="message" rows="5" placeholder="想聊什么" required data-i18n-attr="placeholder:contact.form.msg.ph"></textarea>
            <button type="submit" class="btn btn-primary" data-i18n="contact.form.send">发送</button>
            <p class="form-note" id="formNote"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.copyright">© 2026 戴程鹏 · Powered by GitHub Pages</p>
    </div>
  </footer>

  <script src="js/i18n.js?v=1.5.0"></script>
  <script src="js/main.js?v=1.4.5"></script>
</body>
</html>
