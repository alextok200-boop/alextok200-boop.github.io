<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>版本回滚工具 - 个人网站</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090711;
      color: #eef0ff;
      padding: 40px;
      line-height: 1.6;
    }
    h1 { color: #00ffa3; margin-bottom: 30px; }
    h2 { color: #00c8ff; margin-top: 30px; }
    .version-box {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px 10px 10px 0;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 14px;
    }
    .btn-green { background: #00ffa3; color: #07130d; }
    .btn-pink { background: #ff5ec9; color: #fff; }
    .btn-blue { background: #00c8ff; color: #07130d; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .status { padding: 15px; border-radius: 6px; margin: 10px 0; }
    .status.ok { background: rgba(0,255,163,0.1); border-left: 3px solid #00ffa3; }
    .status.fail { background: rgba(255,94,201,0.1); border-left: 3px solid #ff5ec9; }
    code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>🔧 网站版本管理工具</h1>
  
  <div class="version-box">
    <h2>当前版本状态</h2>
    <p><strong>生产版本:</strong> <span id="prod-version">v1.7.8</span></p>
    <p><strong>本地版本:</strong> <span id="local-version">v1.8.1</span></p>
    <p><strong>回滚目标:</strong> <span id="rollback-target">-</span></p>
  </div>

  <h2>🚀 快速操作</h2>
  <button class="btn btn-green" onclick="rollbackTo('v1.7.8')">回滚到 v1.7.8（稳定版）</button>
  <button class="btn btn-blue" onclick="applyVersion()">应用 v1.8.1</button>
  <button class="btn btn-pink" onclick="clearCache()">清除浏览器缓存</button>
  
  <h2>📋 故障排查</h2>
  <div id="diagnostics"></div>
  
  <h2>⚠️ 紧急回滚（开发者工具）</h2>
  <p>在浏览器控制台运行以下命令：</p>
  <pre><code>localStorage.setItem('rollbacks', 'v1.7.8'); location.reload();</code></pre>
  
  <p>恢复新版本：</p>
  <pre><code>localStorage.removeItem('rollbacks'); location.reload();</code></pre>

  <script>
    // 版本信息
    const VERSIONS = {
      production: 'v1.7.8',
      local: 'v1.8.1'
    };
    
    // 更新显示
    document.getElementById('local-version').textContent = VERSIONS.local;
    
    // 检查当前版本
    function getCurrentVersion() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('v') || VERSIONS.production;
    }
    
    document.getElementById('prod-version').textContent = getCurrentVersion();
    
    // 回滚功能
    function rollbackTo(version) {
      if (confirm(`确定要回滚到 ${version} 吗？\n\n这将立即生效并清除缓存。`)) {
        // 通过 URL 参数切换版本
        const params = new URLSearchParams(window.location.search);
        params.set('v', version);
        window.location.search = params.toString();
      }
    }
    
    // 应用新版本
    function applyVersion() {
      if (confirm(`确定要应用 ${VERSIONS.local} 吗？`)) {
        const params = new URLSearchParams(window.location.search);
        params.delete('v');
        window.location.search = params.toString();
      }
    }
    
    // 清除缓存
    function clearCache() {
      if (confirm('确定要清除浏览器缓存吗？')) {
        // 清除 service worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(function(registration) {
            return registration.unregister();
          }).catch(console.error);
        }
        // 清除 localStorage
        localStorage.clear();
        // 重新加载
        location.reload();
      }
    }
    
    // 诊断检查
    function runDiagnostics() {
      const checks = [];
      
      // CSS 加载检查
      const styleLink = document.querySelector('link[href*="style.css"]');
      checks.push({
        name: 'style.css 加载',
        ok: styleLink ? true : false,
        detail: styleLink ? `v${styleLink.href.match(/v=([\d.]+)/)?.[1] || '?'}` : '未找到'
      });
      
      const patternLink = document.querySelector('link[href*="patterns.css"]');
      checks.push({
        name: 'patterns.css 加载',
        ok: patternLink ? true : false,
        detail: patternLink ? '已加载' : '未找到'
      });
      
      // 关键类检查
      const heroCard = document.querySelector('.hero-card');
      checks.push({
        name: 'Hero 卡片存在',
        ok: !!heroCard,
        detail: heroCard ? '已渲染' : '未找到'
      });
      
      const featureCards = document.querySelectorAll('.feature-card');
      checks.push({
        name: 'Feature 卡片存在',
        ok: featureCards.length > 0,
        detail: `找到 ${featureCards.length} 个`
      });
      
      // 显示结果
      const diagnostics = document.getElementById('diagnostics');
      diagnostics.innerHTML = checks.map(c => `
        <div class="status ${c.ok ? 'ok' : 'fail'}">
          <strong>${c.name}:</strong> ${c.detail}
        </div>
      `).join('');
    }
    
    // 运行诊断
    runDiagnostics();
    
    // 监听 URL 参数变化
    window.addEventListener('load', function() {
      const params = new URLSearchParams(window.location.search);
      const version = params.get('v');
      if (version) {
        document.getElementById('rollback-target').textContent = version;
        document.getElementById('rollback-target').style.color = '#ff5ec9';
      }
    });
  </script>
</body>
</html>
