<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统配置 - 戴程鹏</title>
  <meta name="description" content="系统配置管理">
  <link rel="stylesheet" href="../css/style.css?v=1.7.8">
  <style>
    .settings-section {
      max-width: 600px;
      margin-top: 32px;
    }
    .setting-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .setting-group h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--neon-green);
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .setting-row label {
      font-size: 14px;
      color: var(--text);
    }
    .setting-row input[type="password"],
    .setting-row input[type="text"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      width: 200px;
    }
    .btn-save {
      padding: 8px 16px;
      background: var(--neon-green);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-save:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="../index.html" class="logo"><img class="logo-mark" src="../assets/img/favicon-32.png" alt="">DAI<span class="accent">·</span>CP</a>
      <div class="nav-links">
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../methods.html">方法论</a>
        <a href="../pages/admin.html">管理后台</a>
        <a href="../pages/team/settings.html" class="active">系统配置</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Settings</p>
        <h1>系统配置</h1>
        <p class="hero-sub">修改登录密码 · 配置角色权限 · 管理会话策略</p>
      </div>
    </section>

    <section class="section">
      <div class="container settings-section">
        <div class="setting-group">
          <h3>角色密码管理</h3>
          <div class="setting-row">
            <label>管理员密码</label>
            <input type="password" id="adminPassword" value="••••••••">
          </div>
          <div class="setting-row">
            <label>团队主管密码</label>
            <input type="password" id="leaderPassword" value="••••••••">
          </div>
          <div class="setting-row">
            <label>团队成员密码</label>
            <input type="password" id="memberPassword" value="••••••••">
          </div>
          <div class="setting-row" style="justify-content: flex-end;">
            <button class="btn-save" onclick="savePasswords()">保存修改</button>
          </div>
        </div>

        <div class="setting-group">
          <h3>权限配置说明</h3>
          <p style="font-size: 14px; color: var(--text-dim); line-height: 1.7;">
            修改角色密码后，团队成员需要使用新密码重新登录。<br>
            如需调整访问权限范围，请编辑 <code>js/config/roles.js</code> 文件。<br>
            <strong>注意：</strong>每次修改配置后需要重新部署网站才能生效。
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/config/roles.js"></script>
  <script>
    if (!Auth.isAuthenticated() || !Auth.hasRole('admin')) {
      window.location.href = '/pages/login.html';
    }

    function savePasswords() {
      alert('密码修改功能需要后端支持，当前版本请在 roles.js 中手动修改');
    }
  </script>
</body>
</html>
