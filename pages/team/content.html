<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 - 戴程鹏</title>
  <meta name="description" content="内容管理后台">
  <link rel="stylesheet" href="../css/style.css?v=1.7.8">
  <style>
    .content-list {
      margin-top: 32px;
    }
    .content-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content-item h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }
    .content-item p {
      font-size: 13px;
      color: var(--text-dim);
    }
    .content-actions {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }
    .btn-sm:hover {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }
    .btn-edit {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }
    .btn-edit:hover {
      background: var(--neon-blue);
      color: #000;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="../index.html" class="logo"><img class="logo-mark" src="../assets/img/favicon-32.png" alt="">DAI<span class="accent">·</span>CP</a>
      <div class="nav-links">
        <a href="../index.html">首页</a>
        <a href="../about.html">关于</a>
        <a href="../methods.html">方法论</a>
        <a href="../pages/admin.html">管理后台</a>
        <a href="../pages/team/content.html" class="active">内容管理</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Content</p>
        <h1>内容管理</h1>
        <p class="hero-sub">管理网站公开内容的发布与更新</p>
      </div>
    </section>

    <section class="section">
      <div class="container content-list">
        <div class="content-item">
          <div>
            <h4>方法论文章</h4>
            <p>管理方法论文档的发布状态、排序和标签</p>
          </div>
          <div class="content-actions">
            <a href="#" class="btn-sm btn-edit">管理</a>
          </div>
        </div>

        <div class="content-item">
          <div>
            <h4>博客文章</h4>
            <p>查看和编辑已发布的运营笔记和技术分享</p>
          </div>
          <div class="content-actions">
            <a href="#" class="btn-sm btn-edit">管理</a>
          </div>
        </div>

        <div class="content-item">
          <div>
            <h4>项目案例</h4>
            <p>更新作品集页面的项目描述和展示图片</p>
          </div>
          <div class="content-actions">
            <a href="#" class="btn-sm btn-edit">管理</a>
          </div>
        </div>

        <div class="content-item">
          <div>
            <h4>团队成员</h4>
            <p>管理团队成员列表和角色分配</p>
          </div>
          <div class="content-actions">
            <a href="#" class="btn-sm btn-edit">管理</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/config/roles.js"></script>
  <script>
    if (!Auth.isAuthenticated() || !Auth.hasRole('admin')) {
      window.location.href = '/pages/login.html';
    }
  </script>
</body>
</html>
